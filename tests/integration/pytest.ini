[tool:pytest]
# Pytest configuration for integration tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network connectivity
    database: marks tests that require database connectivity
    load: marks tests that perform load testing
    failure: marks tests that simulate failures
    integration: marks tests as integration tests
    
# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --color=yes

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*

# Timeout (for long-running integration tests)
timeout = 300

# Minimum version
minversion = 6.0