global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Python ingestion service
  - job_name: 'python-ingestion'
    static_configs:
      # - targets: ['python-ingestion:8000']
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s

  # Node.js ingestion service  
  - job_name: 'node-ingestion'
    static_configs:
      # - targets: ['node-ingestion:8000']
      - targets: ['localhost:8002']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s

  # PostgreSQL metrics (if postgres_exporter is added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 10s