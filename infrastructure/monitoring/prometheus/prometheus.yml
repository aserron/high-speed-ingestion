global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Python ingestion service
  - job_name: 'python-ingestion'
    static_configs:
      # - targets: ['python-ingestion:8000']
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s

  # Node.js ingestion service  
  - job_name: 'node-ingestion'
    static_configs:
      # - targets: ['node-ingestion:8000']
      - targets: ['localhost:8002']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s

  # Redis metrics (redis_exporter needed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #   scrape_interval: 10s

  # PostgreSQL metrics (postgres_exporter needed)  
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   scrape_interval: 10s