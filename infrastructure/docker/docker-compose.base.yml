version: "3.8"

# Base services configuration
# This file contains all service definitions and should be extended by environment-specific overrides
# Usage: docker-compose -f infrastructure/docker/docker-compose.base.yml -f infrastructure/docker/docker-compose.dev.yml up

services:
  # Python ingestion service
  python-ingestion:
    build:
      context: ../../apps/python-ingestion
      dockerfile: Dockerfile
    container_name: finance-python-ingestion
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/finance_benchmark
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - postgres
    ports:
      - "8001:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    networks:
      - finance-network

  # Node.js ingestion service
  node-ingestion:
    build:
      context: ../../apps/node-ingestion
      dockerfile: Dockerfile
    container_name: finance-node-ingestion
    environment:
      - APP_MODE=full
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/finance_benchmark
      - LOG_LEVEL=info
    depends_on:
      - redis
      - postgres
    ports:
      - "8002:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
    networks:
      - finance-network

  # Redis for high-speed in-memory storage
  redis:
    image: redis:7-alpine
    container_name: finance-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - finance-network

  # PostgreSQL for historical data persistence
  postgres:
    image: postgres:15-alpine
    container_name: finance-postgres
    environment:
      - POSTGRES_DB=finance_benchmark
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../scripts/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    networks:
      - finance-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: finance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    networks:
      - finance-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: finance-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - finance-network

  # Dashboard for service monitoring
  dashboard:
    build:
      context: ../../apps/dashboard
      dockerfile: Dockerfile
    container_name: finance-dashboard
    ports:
      - "8080:8080"
    depends_on:
      - python-ingestion
      - node-ingestion
      - prometheus
      - grafana
    networks:
      - finance-network

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  finance-network:
    driver: bridge
