version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  python-ingestion:
    build:
      target: runtime
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=INFO
    # Remove volume mounts for production
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 3G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  node-ingestion:
    build:
      target: runtime
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    # Remove volume mounts for production
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 3G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  redis:
    restart: unless-stopped
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  postgres:
    restart: unless-stopped
    environment:
      - POSTGRES_DB=finance_benchmark
    # Remove dev seed script
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  prometheus:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M