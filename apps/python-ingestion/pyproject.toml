[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ingestion-python"
version = "1.0.0"
description = "High-performance financial data ingestion system in Python"
authors = [
    {name = "Finance Benchmark Team", email = "team@finance-benchmark.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Networking",
]

dependencies = [
    # Async runtime with uvloop for maximum performance
    "uvloop>=0.19.0",
    
    # WebSocket client
    "websockets>=12.0",
    
    # High-performance serialization
    "msgpack>=1.0.7",
    
    # Database drivers
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "redis[hiredis]>=5.0.1",  # Redis with C extension
    
    # Configuration management
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Structured logging
    "structlog>=23.2.0",
    
    # Metrics and monitoring
    "prometheus-client>=0.19.0",
    
    # HTTP server for API endpoints
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Utilities
    "click>=8.1.7",  # CLI interface
    "python-json-logger>=2.0.7",  # JSON logging
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

benchmark = [
    "psutil>=5.9.6",  # System resource monitoring
    "numpy>=1.25.0",  # Statistical calculations
    "matplotlib>=3.8.0",  # Plotting for reports
]

[project.scripts]
finance-ingestion = "finance_ingestion.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/finance-ingestion-benchmark"
Repository = "https://github.com/your-org/finance-ingestion-benchmark"
Issues = "https://github.com/your-org/finance-ingestion-benchmark/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Black configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]